<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyBuddy{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            display: flex;
            background-color: #121212; /* Dark theme background */
            color: #ffffff; /* Text color for dark theme */
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #1e1e1e; /* Darker sidebar */
            padding: 20px;
            height: 100vh;
            position: fixed;
            overflow-y: auto;
            transition: all 0.3s ease; /* Smooth transition for collapse */
            z-index: 1000; /* Ensure it stays above other elements */
        }
        .sidebar h4 {
            color: #bb86fc; /* Accent color for branding */
            font-weight: bold;
            margin-bottom: 20px;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            margin: 10px 0;
            color: #ffffff;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease; /* Hover effect */
        }
        .sidebar a:hover {
            background-color: #bb86fc;
            color: #121212;
        }
        .sidebar a i {
            margin-right: 10px;
            font-size: 18px;
        }

        /* Login/Logout Button in Sidebar */
        .sidebar .auth-button {
            margin-top: auto; /* Push to the bottom */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: #bb86fc;
            color: #121212;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .sidebar .auth-button:hover {
            background-color: #9c71f7;
        }

        /* Main Content */
        .content {
            margin-left: 270px; /* Offset for sidebar */
            padding: 20px;
            flex-grow: 1;
            transition: margin-left 0.3s ease; /* Smooth transition for collapse */
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: absolute;
                top: 0;
                left: -100%; /* Hide sidebar off-screen */
                display: block;
                transition: left 0.3s ease; /* Smooth transition for toggle */
            }
            .sidebar.active {
                left: 0; /* Show sidebar when active */
            }
            .content {
                margin-left: 0;
            }
        }

        /* Hamburger Icon */
        .hamburger {
            display: none;
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1001;
            font-size: 2rem;
            cursor: pointer;
            color: #ffffff;
        }
        @media (max-width: 768px) {
            .hamburger {
                display: block; /* Show hamburger icon on small screens */
            }
        }
    </style>
</head>
<body>
    <!-- Hamburger Icon -->
    <div class="hamburger" id="hamburger">
        <i class="fa-solid fa-bars"></i>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h4>StudyBuddy</h4>
        <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
        <a href="{% url 'chat_list' %}"><i class="fa-solid fa-comments"></i> Chats</a>
        <a href="{% url 'new_chat' %}"><i class="fa-solid fa-plus"></i> New Chat</a>
        <a href="{% url 'new_group' %}"><i class="fa-solid fa-users"></i> New Group</a>
        <a href="{% url 'profile' %}"><i class="fa-solid fa-user"></i> Profile</a>

        <!-- Login/Logout Button -->
        <a href="{% if user.is_authenticated %}{% url 'logout' %}{% else %}{% url 'login_signup' %}{% endif %}"
           class="auth-button">
            <i class="fa-solid {% if user.is_authenticated %}fa-sign-out-alt{% else %}fa-sign-in-alt{% endif %} me-2"></i>
            {% if user.is_authenticated %}Logout{% else %}Login{% endif %}
        </a>
    </div>

    <!-- Main Content -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS for Sidebar Toggle -->
    <script>
        // Toggle sidebar
        const sidebar = document.getElementById('sidebar');
        const hamburger = document.getElementById('hamburger');

        hamburger.addEventListener('click', () => {
            sidebar.classList.toggle('active');
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('active'); // Reset sidebar on larger screens
            }
        });
    </script>
</body>
</html>
