{% extends "base.html" %}

{% block title %}New Chat - StudyBuddy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4 text-center">Start a New Chat</h2>

            <!-- User List -->
            <ul class="list-group">
                {% for user in users_list %}
                <li class="list-group-item bg-dark text-white border-0 mb-2 rounded shadow-sm">
                    <a href="{% url 'start_chat' user_id=user.id %}" class="text-decoration-none d-flex align-items-center">
                        <!-- Avatar/Icon -->
                        <i class="fa-solid fa-user-circle me-3 text-warning" style="font-size: 2rem;"></i>
                        <!-- Username -->
                        <span>{{ user.username }}</span>
                    </a>
                </li>
                {% empty %}
                <div class="card bg-dark text-white text-center p-4">
                    <i class="fa-solid fa-users-slash fa-2x mb-3"></i>
                    <p>No other users available. Invite friends to join!</p>
                </div>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
